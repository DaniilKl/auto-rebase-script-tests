---
name: Test rebase with conflict

on:
  workflow_dispatch:

env:
  run_id: "${{ github.run_id }}"

jobs:
  try-rebase:
    uses: TrenchBoot/.github/.github/workflows/rebase.yml@v2
    secrets:
      first-remote-token: ${{secrets.PAT_TOKEN}}
    permissions:
      # For creation/deletion/pushing to branches and creating PRs
      contents: write
    with:
      downstream-repo: 'https://github.com/DaniilKl/auto-rebase-script-tests.git'
      downstream-branch: 'feature'
      upstream-repo: 'https://github.com/DaniilKl/auto-rebase-script-tests-upstream.git'
      upstream-branch: 'feature-upstream'
      commit-user-name: 'github-actions[bot]'
      commit-user-email: 'github-actions[bot]@users.noreply.github.com'
      cicd-trigger-resume: '7. Rerun the workflow https://github.com/DaniilKl/auto-rebase-script-tests/actions/runs/${{ github.run_id }} to resume automated rebase.'
      additional-params: '--use-commit-as-base'
